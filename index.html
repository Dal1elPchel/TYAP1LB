<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="analyzer">
    <section class="editor">
        <h2>Исходный код</h2>

        <textarea
                id="codeInput"
                placeholder="Введите исходный код..."
                spellcheck="false"
        ></textarea>
        <div class="buttons">
            <button id="analyzeButton">
                Анализировать
            </button>
            <button id="randCodeButton">
                Сгенерировать код
            </button>
        </div>
    </section>

    <section class="result">
        <h2>Результат анализа</h2>

        <div id="resultOutput"></div>
    </section>
</main>

<script src="index.js" type="module" defer></script>
</body>
</html>
